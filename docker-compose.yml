version: '3.8'

services:
  iyp-updater:
    image: python:3.10-slim
    container_name: iyp-updater
    environment:
      - IYP_DUMP_URL=https://iyp.iijlab.net/dumps/latest.dump
    volumes:
      - ./api/scripts:/scripts
      - ./dumps:/data/dumps
    command: python /scripts/update_dump.py

  iyp-neo4j:
    image: neo4j:5.18.0-community
    container_name: iyp-neo4j
    environment:
      - NEO4J_AUTH=none
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - ./api/scripts:/scripts
      - ./dumps:/data/dumps
    entrypoint: ["/bin/bash", "/scripts/entrypoint-neo4j.sh"]
    depends_on:
      iyp-updater:
        condition: service_completed_successfully
    restart: always

  iyp-api:
    build: ./api
    container_name: iyp-api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://iyp-neo4j:7687
    depends_on:
      - iyp-neo4j
    restart: always

  iyp-web:
    build: ./web
    container_name: iyp-web
    restart: always

  iyp-nginx:
    image: nginx:alpine
    container_name: iyp-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - iyp-web
      - iyp-api
    restart: always

volumes:
  neo4j_data:
