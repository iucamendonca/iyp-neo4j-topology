version: '3.8'

services:
  iyp-neo4j:
    image: neo4j:5-community
    container_name: iyp-neo4j
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=none
    volumes:
      - neo4j_data:/data
    networks:
      - iyp-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  iyp-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: iyp-api
    restart: always
    environment:
      - NEO4J_URI=bolt://iyp-neo4j:7687
    networks:
      - iyp-network
    depends_on:
      iyp-neo4j:
        condition: service_healthy

  iyp-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: iyp-web
    restart: always
    networks:
      - iyp-network

  iyp-nginx:
    image: nginx:alpine
    container_name: iyp-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - iyp-network
    depends_on:
      - iyp-api
      - iyp-web

volumes:
  neo4j_data:

networks:
  iyp-network:
    driver: bridge
